name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

# Required: a called workflow can only narrow these, never widen them. PR-Agent
# writes review comments through both the pulls and issues APIs.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Upstream in review.reusable.yml (not visible in a caller-only PR review):
  # - issue_comment author-association gating
  # - v1-vs-SHA pin tradeoff
  # - PR_AGENT_CONFIG_BRANCH=<default branch> so .pr_agent.toml is loaded
  #   (must exist on the default branch; PR-head-only copies are ignored)
  # - AGENTS.md is also read from the default branch (repo_context_files)
  # - /review only; describe/improve + ticket/security/tests theater forced off
  review:
    uses: crimsonsunset/jsg-pr-quality/.github/workflows/review.reusable.yml@v1
    secrets:
      openrouter-key: ${{ secrets.OPENROUTER__KEY }}
