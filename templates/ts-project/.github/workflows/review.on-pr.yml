name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

# Required: a called workflow can only narrow these, never widen them. PR-Agent
# writes review comments through both the pulls and issues APIs.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # issue_comment author-association gating and the v1-vs-SHA pin tradeoff both
  # live upstream in review.reusable.yml — not missing here, just not visible
  # to a PR review scoped to this repo's diff.
  review:
    uses: crimsonsunset/jsg-pr-quality/.github/workflows/review.reusable.yml@v1
    secrets:
      openrouter-key: ${{ secrets.OPENROUTER__KEY }}
