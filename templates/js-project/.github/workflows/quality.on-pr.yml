name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Required: a called workflow can only narrow these, never widen them. Dropping
# this block makes the run fail at startup on any repo whose default token
# permission is read-only.
permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    uses: crimsonsunset/jsg-pr-quality/.github/workflows/quality.reusable.yml@v1
    with:
      node-version: '22'
      package-manager: npm
      lint-script: ci:lint
      test-script: ci:test
