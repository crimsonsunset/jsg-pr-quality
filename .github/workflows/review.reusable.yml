name: PR Agent Review (reusable)

on:
  workflow_call:
    secrets:
      openrouter-key:
        description: OpenRouter API key for PR-Agent (OPENROUTER__KEY)
        required: true

jobs:
  pr_agent_job:
    # pull_request runs always review, even bot-pushed commits. issue_comment runs
    # stay gated so a random commenter can't burn the shared OPENROUTER__KEY.
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event.sender.type != 'Bot' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run PR-Agent
    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.openrouter-key }}
          # Without this, get_repo_settings() never fetches .pr_agent.toml from ANY
          # branch (not even the default) and silently falls back to this fork's
          # built-in gpt-5.6 default. Pinning to the default branch (not the PR's own
          # head) also stops a PR author from hijacking the review via their own
          # .pr_agent.toml. See pr_agent/git_providers/github_provider.py get_repo_settings().
          PR_AGENT_CONFIG_BRANCH: ${{ github.event.repository.default_branch }}
          # Review only. Describe/improve and the checkbox sections (ticket
          # compliance, security all-clear, tests, effort labels) invent
          # findings to fill empty slots. Env wins over a stale consumer toml.
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          pr_reviewer.require_ticket_analysis_review: 'false'
          pr_reviewer.require_security_review: 'false'
          pr_reviewer.require_tests_review: 'false'
          pr_reviewer.require_estimate_effort_to_review: 'false'
          pr_reviewer.enable_review_labels_security: 'false'
          pr_reviewer.enable_review_labels_effort: 'false'
          # Default true maps feature/1-auth → issue #1 and invents ticket scores.
          config.extract_issue_from_branch: 'false'
          # Default true posts a "no major issues" comment on a clean PR.
          pr_reviewer.publish_output_no_suggestions: 'false'
          # Ceiling, not a quota. Prompt already allows 0-N; do not pad to fill it.
          pr_reviewer.num_max_findings: '10'
