name: PR Quality Checks (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '22'
      package-manager:
        description: Package manager (npm or pnpm)
        type: string
        required: false
        default: npm
      lint-script:
        description: npm/pnpm script that runs the caller's CI orchestrator
        type: string
        required: false
        default: ci:lint
      eslint-flags:
        description: Paths passed to reviewdog/action-eslint
        type: string
        required: false
        default: .
      run-audit:
        description: Run npm/pnpm audit before install
        type: boolean
        required: false
        default: true
      run-semgrep:
        description: Run Semgrep CE
        type: boolean
        required: false
        default: true
      run-gitleaks:
        description: Run gitleaks
        type: boolean
        required: false
        default: true
      run-reviewdog:
        description: Post inline ESLint comments via reviewdog
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Dependency audit
    if: inputs.run-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.audit.outcome }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      # Audit reads the lockfile only; no install and no third-party package execution.
      - name: Dependency audit (npm)
        id: audit
        if: inputs.package-manager == 'npm'
        continue-on-error: true
        run: npm audit --audit-level=low
      - name: Dependency audit (pnpm)
        id: audit_pnpm
        if: inputs.package-manager == 'pnpm'
        continue-on-error: true
        run: pnpm audit --audit-level=low
      - if: |
          (inputs.package-manager == 'npm' && steps.audit.outcome == 'failure') ||
          (inputs.package-manager == 'pnpm' && steps.audit_pnpm.outcome == 'failure')
        run: exit 1

  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: [audit]
    if: always() && (needs.audit.result == 'success' || needs.audit.result == 'skipped')
    outputs:
      summary: ${{ steps.lint_checks.outputs.summary || steps.lint_checks_pnpm.outputs.summary }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install (npm)
        if: inputs.package-manager == 'npm'
        env:
          HUSKY: '0'
        run: npm ci
      - name: Install (pnpm)
        if: inputs.package-manager == 'pnpm'
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Run quality checks (npm)
        id: lint_checks
        if: inputs.package-manager == 'npm'
        continue-on-error: true
        run: npm run ${{ inputs.lint-script }}
      - name: Run quality checks (pnpm)
        id: lint_checks_pnpm
        if: inputs.package-manager == 'pnpm'
        continue-on-error: true
        run: pnpm run ${{ inputs.lint-script }}
      - name: ESLint reviewdog
        if: >
          always() &&
          inputs.run-reviewdog &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: ${{ inputs.eslint-flags }}
          fail_level: none
      - if: |
          (inputs.package-manager == 'npm' && steps.lint_checks.outcome == 'failure') ||
          (inputs.package-manager == 'pnpm' && steps.lint_checks_pnpm.outcome == 'failure')
        run: exit 1

  semgrep:
    name: Semgrep
    if: inputs.run-semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.scan.outcome }}
    container:
      # Pin by tag+digest so consumers don't float on :latest.
      image: semgrep/semgrep:1.59.1@sha256:fc8bcc6077e8c3bfadc3f612017f73447096143adceb04fdcd103227009b1bbf
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep CE
        id: scan
        continue-on-error: true
        run: semgrep scan --config p/typescript --config p/javascript --config p/secrets --error --quiet
      - if: steps.scan.outcome == 'failure'
        run: exit 1

  gitleaks:
    name: Gitleaks
    if: inputs.run-gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.scan.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        id: scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.scan.outcome == 'failure'
        run: exit 1

  report:
    name: PR Report
    if: always()
    needs: [audit, quality, semgrep, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          header: quality-report
          message: |
            ## PR Quality Report

            ${{ needs.quality.outputs.summary || '### Quality

            **Setup failed** - could not run checks.' }}

            ### Security

            | Check | Status |
            | --- | --- |
            | Dependency audit | ${{ needs.audit.result == 'skipped' && 'Skipped' || (needs.audit.result == 'success' && 'Passed' || '**Failed**') }} |
            | Semgrep | ${{ needs.semgrep.result == 'skipped' && 'Skipped' || (needs.semgrep.result == 'success' && 'Passed' || '**Failed**') }} |
            | Gitleaks | ${{ needs.gitleaks.result == 'skipped' && 'Skipped' || (needs.gitleaks.result == 'success' && 'Passed' || '**Failed**') }} |

            ---
            [View full logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      - name: Fail unless all required jobs succeeded
        if: |
          (needs.audit.result != 'success' && needs.audit.result != 'skipped') ||
          needs.quality.result != 'success' ||
          (needs.semgrep.result != 'success' && needs.semgrep.result != 'skipped') ||
          (needs.gitleaks.result != 'success' && needs.gitleaks.result != 'skipped')
        run: exit 1
