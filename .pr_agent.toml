[config]
model = "openrouter/anthropic/claude-sonnet-4"
fallback_models = ["openrouter/deepseek/deepseek-chat"]
custom_model_max_tokens = 128000
# Default true maps feature/1-auth → issue #1 and invents ticket scores.
extract_issue_from_branch = false
# /review injects this from the default branch (500-line cap). Missing = skip.
repo_context_files = ["AGENTS.md"]

# Shared OpenRouter key is `pr-agent`.
# GitHub Actions secret: OPENROUTER__KEY
# Local value: OPENROUTER_KEY_PR_AGENT in ~/.cursor/secrets.env
# Per-repo identity is these headers — analytics group by `app`.
# https://openrouter.ai/docs/app-attribution
#
# Hub review.reusable.yml loads THIS file from the repo DEFAULT branch only
# (PR_AGENT_CONFIG_BRANCH). Merge it before expecting model overrides; a
# PR-head-only copy is ignored and the Action falls back to gpt-5.6.
[litellm]
extra_headers = '{"HTTP-Referer":"https://github.com/crimsonsunset/jsg-pr-quality","X-OpenRouter-Title":"jsg-pr-quality","X-Title":"jsg-pr-quality"}'

[github_action_config]
auto_review = true
auto_describe = false
auto_improve = false
pr_actions = ["opened", "reopened", "synchronize", "ready_for_review"]

[ignore]
glob = [
  "**/package-lock.json",
  "docs/planning/**",
  "templates/**/package-lock.json",
]

[pr_reviewer]
require_ticket_analysis_review = false
require_security_review = false
require_tests_review = false
require_estimate_effort_to_review = false
enable_review_labels_security = false
enable_review_labels_effort = false
# Default true posts a "no major issues" comment on a clean PR.
publish_output_no_suggestions = false
# Ceiling, not a quota. Prompt already allows 0-N; do not pad to fill it.
num_max_findings = 10
extra_instructions = """
House rules are in AGENTS.md. Zero findings is valid. Do not invent issues.
"""

[pr_code_suggestions]
extra_instructions = """
Same standards as pr_reviewer. Prefer concrete, minimal diffs. Skip formatting-only suggestions.
"""

[pr_description]
publish_labels = false
